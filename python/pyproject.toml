[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "splatset"
version = "0.4.0"
description = "A free collection of 3D Gaussian splat objects, loaded in one line, each labelled with how it was made."
readme = "README.md"
requires-python = ">=3.9"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Padilla" }]
keywords = ["gaussian-splatting", "3dgs", "splat", "dataset", "3d", "geometry"]
dependencies = ["numpy>=1.20"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marcelpadilla/splats"
Gallery = "https://marcelpadilla.com/Projects/Gaussian_Splat_Object_Dataset/"
Source = "https://github.com/marcelpadilla/splats"
Issues = "https://github.com/marcelpadilla/splats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/splatset"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
