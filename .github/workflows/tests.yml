name: tests

# Runs the suite on all three operating systems and on the oldest and newest
# supported Python. The package claims to work on macOS, Linux and Windows, and
# this is what makes that claim checkable rather than assumed: the cache
# directory rules and the path handling differ per platform.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python pytest

      - name: Run the suite
        run: python -m pytest python/tests -q

  inventory-in-sync:
    name: inventory is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # data/inventory.json is the source of truth; the packaged copy and the
      # README gallery are generated from it. If regenerating changes anything,
      # someone edited a generated file by hand or forgot to run the script.
      - run: python python/sync_inventory.py
      - run: git diff --exit-code

  # These two jobs are a rehearsal of release.yml: same build command, same
  # artifact handoff between two jobs, same action versions. They mean the
  # release path is exercised on every push, instead of being discovered as
  # broken halfway through an actual publish, when the only way to retry is to
  # burn a version number.
  package:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build python
          python -m twine check python/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-rehearsal
          path: python/dist/

  install-from-wheel:
    name: install the built wheel
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: dist-rehearsal
          path: dist/
      - name: Install the wheel and run the suite against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          python -m pytest python/tests -q
